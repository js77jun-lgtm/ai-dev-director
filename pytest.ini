[pytest]
testpaths = tests
pythonpath = .
norecursedirs = scratch runs smoke_project demo_project brake_project .director_worktrees
addopts = -m "not integration_cli and not integration_dashboard"
markers =
    integration_cli: launches real Codex/Claude/Antigravity CLIs (opt-in: pytest -m integration_cli)
    integration_dashboard: needs a live dashboard on 127.0.0.1:8080 (opt-in: pytest -m integration_dashboard)
    head_proxy: runs with the production HEAD proxy autonomy policy instead of the strict legacy policy
